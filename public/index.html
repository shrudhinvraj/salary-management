<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACME Salary Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.5; }
    #root { min-height: 100vh; }
    nav { background: #1e293b; color: #fff; padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 32px; position: sticky; top: 0; z-index: 100; }
    nav a { color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; padding: 6px 0; border-bottom: 2px solid transparent; transition: all .15s; }
    nav a:hover { color: #e2e8f0; }
    nav a.active { color: #fff; border-bottom-color: #38bdf8; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .page-header h1 { font-size: 24px; font-weight: 700; }
    .btn { padding: 8px 16px; border-radius: 6px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; border: 1px solid #e2e8f0; }
    .card-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .card-value { font-size: 24px; font-weight: 700; color: #0f172a; }
    .card-sub { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; }
    th, td { padding: 10px 14px; text-align: left; font-size: 13px; }
    th { background: #f1f5f9; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
    tr:not(:last-child) td { border-bottom: 1px solid #f1f5f9; }
    tr:hover td { background: #f8fafc; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
    .badge-active { background: #dcfce7; color: #166534; }
    .badge-inactive { background: #fee2e2; color: #991b1b; }
    .badge-leave { background: #fef9c3; color: #854d0e; }
    .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; background: #fff; outline: none; }
    .filter-bar input:focus, .filter-bar select:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.12); }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 16px; }
    .pagination button { padding: 6px 12px; border: 1px solid #d1d5db; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }
    .pagination span { font-size: 12px; color: #64748b; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 200; }
    .modal { background: #fff; border-radius: 12px; padding: 24px; min-width: 380px; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 18px; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    .form-group input:focus, .form-group select:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 2px rgba(37,99,235,.12); }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .error-msg { color: #dc2626; font-size: 12px; margin-top: 2px; }
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
    .detail-grid dt { font-size: 12px; color: #64748b; font-weight: 500; }
    .detail-grid dd { font-size: 14px; font-weight: 500; }
    .section { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .section h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .salary-highlight { font-size: 32px; font-weight: 700; color: #0f172a; }
    .empty { color: #94a3b8; font-style: italic; padding: 24px; text-align: center; }
    @media (max-width: 640px) { .detail-grid { grid-template-columns: 1fr; } .cards { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script type="text/babel" src="app.js"></script>
</body>
</html>
